<!DOCTYPE html>
<html>

<head>
    <title>Avatar Cloths Try-On</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #111122;
            font-family: sans-serif;
        }

        #ui {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 16px;
            z-index: 10;
        }

        .slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
        }

        .slot-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .upload-btn {
            padding: 10px 22px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #shirt-upload-btn {
            background: #4f8ef7;
            box-shadow: 0 4px 14px rgba(79, 142, 247, 0.35);
        }

        #shirt-upload-btn:hover {
            background: #2d6ee0;
        }

        #pant-upload-btn {
            background: #7c5cbf;
            box-shadow: 0 4px 14px rgba(124, 92, 191, 0.35);
        }

        #pant-upload-btn:hover {
            background: #5e3fa3;
        }

        .file-input {
            display: none;
        }

        .preview-box {
            display: none;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 12px;
            max-width: 160px;
        }

        .preview-box img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #555;
            flex-shrink: 0;
        }

        .preview-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reset-btn {
            display: none;
            padding: 5px 14px;
            background: transparent;
            color: #888;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="status">Loading avatar...</div>

    <div id="ui">

        <div class="slot">
            <span class="slot-label">👕 Shirt</span>
            <div class="preview-box" id="shirt-preview-box">
                <img id="shirt-preview-img" src="" alt="shirt" />
                <span class="preview-name" id="shirt-preview-name"></span>
            </div>
            <button class="upload-btn" id="shirt-upload-btn">Upload Shirt</button>
            <input class="file-input" type="file" id="shirt-file-input" accept="image/*" />
            <button class="reset-btn" id="shirt-reset-btn">Reset Shirt</button>
        </div>

        <div class="slot">
            <span class="slot-label">👖 Pant</span>
            <div class="preview-box" id="pant-preview-box">
                <img id="pant-preview-img" src="" alt="pant" />
                <span class="preview-name" id="pant-preview-name"></span>
            </div>
            <button class="upload-btn" id="pant-upload-btn">Upload Pant</button>
            <input class="file-input" type="file" id="pant-file-input" accept="image/*" />
            <button class="reset-btn" id="pant-reset-btn">Reset Pant</button>
        </div>

    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(devicePixelRatio);
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(1, 2, 2);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x8899ff, 0.4);
        fillLight.position.set(-1, 0.5, -1);
        scene.add(fillLight);

        const statusEl = document.getElementById('status');

        let shirtMeshes = [];
        let shirtOrigMat = {};
        let pantMeshes = [];
        let pantOrigMat = {};

        const loader = new GLTFLoader();
        loader.load(
            `https://models.readyplayer.me/664777277ad2faec5b6079f0.glb`,
            (gltf) => {
                scene.add(gltf.scene);
                gltf.scene.traverse((node) => {
                    if (!node.isMesh) return;

                    if (node.name === 'Wolf3D_Outfit_Top') {
                        shirtMeshes.push(node);
                        shirtOrigMat[node.uuid] = Array.isArray(node.material)
                            ? node.material.map(m => m.clone())
                            : node.material.clone();
                    }
                    if (node.name === 'Wolf3D_Outfit_Bottom') {
                        pantMeshes.push(node);
                        pantOrigMat[node.uuid] = Array.isArray(node.material)
                            ? node.material.map(m => m.clone())
                            : node.material.clone();
                    }
                });
                statusEl.textContent = 'Avatar ready — upload a shirt or pant!';
            },
            (xhr) => {
                statusEl.textContent = `Loading… ${Math.round(xhr.loaded / xhr.total * 100)}%`;
            },
            () => { statusEl.textContent = 'Failed to load avatar'; }
        );

        function processImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const w = img.width, h = img.height;
                    const tmp = document.createElement('canvas');
                    tmp.width = w; tmp.height = h;
                    const tctx = tmp.getContext('2d');
                    tctx.drawImage(img, 0, 0);
                    const raw = tctx.getImageData(0, 0, w, h);
                    const d = raw.data;

                    let x0 = w, x1 = 0, y0 = h, y1 = 0;
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const i = (y * w + x) * 4;
                            const br = (d[i] + d[i + 1] + d[i + 2]) / 3;
                            if (d[i + 3] > 20 && br < 240) {
                                if (x < x0) x0 = x; if (x > x1) x1 = x;
                                if (y < y0) y0 = y; if (y > y1) y1 = y;
                            }
                        }
                    }
                    const pad = 6;
                    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
                    x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
                    const cw = x1 - x0, ch = y1 - y0;

                    const out = document.createElement('canvas');
                    out.width = cw; out.height = ch;
                    const octx = out.getContext('2d');
                    octx.drawImage(tmp, x0, y0, cw, ch, 0, 0, cw, ch);

                    const od = octx.getImageData(0, 0, cw, ch);
                    const px = od.data;

                    const isBg = (idx) => {
                        const a = px[idx * 4 + 3];
                        if (a < 20) return true;
                        const r = px[idx * 4], g = px[idx * 4 + 1], b = px[idx * 4 + 2];
                        const br = (r + g + b) / 3;
                        return br > 230 && Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b)) < 20;
                    };

                    const visited = new Uint8Array(cw * ch);
                    const queue = [];
                    const enqueue = (idx) => {
                        if (idx < 0 || idx >= cw * ch || visited[idx] || !isBg(idx)) return;
                        visited[idx] = 1;
                        queue.push(idx);
                    };

                    for (let x = 0; x < cw; x++) { enqueue(x); enqueue((ch - 1) * cw + x); }
                    for (let y = 1; y < ch - 1; y++) { enqueue(y * cw); enqueue(y * cw + cw - 1); }

                    while (queue.length > 0) {
                        const idx = queue.pop();
                        px[idx * 4 + 3] = 0;
                        const x = idx % cw, y = Math.floor(idx / cw);
                        if (x > 0) enqueue(idx - 1);
                        if (x < cw - 1) enqueue(idx + 1);
                        if (y > 0) enqueue(idx - cw);
                        if (y < ch - 1) enqueue(idx + cw);
                    }
                    octx.putImageData(od, 0, 0);

                    const buckets = {};
                    const STEP = 32;
                    for (let i = 0; i < px.length; i += 4) {
                        if (px[i + 3] < 20) continue;
                        const r = px[i], g = px[i + 1], b = px[i + 2];
                        const key = `${Math.floor(r / STEP)}_${Math.floor(g / STEP)}_${Math.floor(b / STEP)}`;
                        if (!buckets[key]) buckets[key] = { r: 0, g: 0, b: 0, n: 0 };
                        buckets[key].r += r; buckets[key].g += g;
                        buckets[key].b += b; buckets[key].n++;
                    }
                    let best = null;
                    for (const k in buckets) {
                        if (!best || buckets[k].n > best.n) best = buckets[k];
                    }
                    const dominantColor = best
                        ? new THREE.Color(best.r / best.n / 255, best.g / best.n / 255, best.b / best.n / 255)
                        : new THREE.Color(0.4, 0.4, 0.4);

                    resolve({ dataUrl: out.toDataURL('image/png'), width: cw, height: ch, dominantColor });
                };
                img.src = url;
            });
        }

        function buildMaterial(texture, texW, texH, mesh) {
            const bbox = new THREE.Box3().setFromObject(mesh);
            const meshW = bbox.max.x - bbox.min.x;
            const meshH = bbox.max.y - bbox.min.y;
            const meshAR = meshW / meshH;
            const texAR = texW / texH;

            let scaleU = 1, scaleV = 1, offsetU = 0, offsetV = 0;
            if (texAR > meshAR) {
                scaleV = meshAR / texAR;
                offsetV = (1 - scaleV) / 2;
            } else {
                scaleU = texAR / meshAR;
                offsetU = (1 - scaleU) / 2;
            }

            return new THREE.ShaderMaterial({
                uniforms: {
                    map: { value: texture },
                    bboxMin: { value: new THREE.Vector2(bbox.min.x, bbox.min.y) },
                    bboxMax: { value: new THREE.Vector2(bbox.max.x, bbox.max.y) },
                    uvScale: { value: new THREE.Vector2(scaleU, scaleV) },
                    uvOffset: { value: new THREE.Vector2(offsetU, offsetV) },
                    lightDir: { value: new THREE.Vector3(1, 2, 2).normalize() },
                    fillDir: { value: new THREE.Vector3(-1, 0.5, -1).normalize() },
                    lightColor: { value: new THREE.Color(1.0, 1.0, 1.0) },
                    fillColor: { value: new THREE.Color(0.53, 0.6, 1.0) },
                    ambientCol: { value: new THREE.Color(0.35, 0.35, 0.4) },
                    fallbackColor: { value: mesh.userData.dominantColor || new THREE.Color(0.4, 0.4, 0.4) },
                },
                vertexShader: `
                    uniform vec2 bboxMin;
                    uniform vec2 bboxMax;
                    uniform vec2 uvScale;
                    uniform vec2 uvOffset;

                    varying vec2  vUV;
                    varying vec3  vWorldNormal;
                    varying float vFrontFace;

                    void main() {
                        vec4 worldPos = modelMatrix * vec4(position, 1.0);
                        vec2 raw = (worldPos.xy - bboxMin) / (bboxMax - bboxMin);
                        vUV = raw * uvScale + uvOffset;
                        vWorldNormal = normalize(mat3(modelMatrix) * normal);
                        vFrontFace   = step(0.0, dot(vWorldNormal, vec3(0.0, 0.0, 1.0)));
                        gl_Position  = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D map;
                    uniform vec3  lightDir;
                    uniform vec3  fillDir;
                    uniform vec3  lightColor;
                    uniform vec3  fillColor;
                    uniform vec3  ambientCol;
                    uniform vec3  fallbackColor;

                    varying vec2  vUV;
                    varying vec3  vWorldNormal;
                    varying float vFrontFace;

                    void main() {
                        vec2 uv       = clamp(vUV, 0.0, 1.0);
                        vec4 texColor = texture2D(map, uv);
                        vec3 baseColor = (texColor.a < 0.4) ? fallbackColor : texColor.rgb;

                        vec3 n = normalize(vWorldNormal);
                        float diff     = max(dot(n, lightDir), 0.0);
                        float fillDiff = max(dot(n, fillDir),  0.0) * 0.4;
                        vec3 lighting  = ambientCol + lightColor * diff + fillColor * fillDiff;
                        lighting      *= mix(0.55, 1.0, vFrontFace);

                        gl_FragColor = vec4(baseColor * lighting, 1.0);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide,
            });
        }

        function applyTexture(meshes, texture, texW, texH, dominantColor) {
            texture.needsUpdate = true;
            meshes.forEach((mesh) => {
                mesh.userData.dominantColor = dominantColor;
                mesh.material = buildMaterial(texture, texW, texH, mesh);
            });
        }

        function resetMeshes(meshes, origMats) {
            meshes.forEach((mesh) => {
                const orig = origMats[mesh.uuid];
                mesh.material = Array.isArray(orig) ? orig.map(m => m.clone()) : orig.clone();
            });
        }

        function wireUpSlot({ meshesRef, uploadBtnId, fileInputId,
            previewBoxId, previewImgId, previewNameId,
            resetBtnId, origMats, label }) {
            const uploadBtn = document.getElementById(uploadBtnId);
            const fileInput = document.getElementById(fileInputId);
            const previewBox = document.getElementById(previewBoxId);
            const previewImg = document.getElementById(previewImgId);
            const previewName = document.getElementById(previewNameId);
            const resetBtn = document.getElementById(resetBtnId);

            uploadBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const objectURL = URL.createObjectURL(file);
                previewImg.src = objectURL;
                previewName.textContent = file.name;
                previewBox.style.display = 'flex';
                resetBtn.style.display = 'block';
                statusEl.textContent = `Processing ${label}…`;

                const { dataUrl, width, height, dominantColor } = await processImage(objectURL);

                statusEl.textContent = `Applying ${label}…`;
                const texture = new THREE.TextureLoader().load(dataUrl, () => {
                    applyTexture(meshesRef(), texture, width, height, dominantColor);
                    statusEl.textContent = `${label} applied!`;
                });
            });

            resetBtn.addEventListener('click', () => {
                resetMeshes(meshesRef(), origMats);
                previewBox.style.display = 'none';
                resetBtn.style.display = 'none';
                previewImg.src = '';
                fileInput.value = '';
                statusEl.textContent = `${label} reset`;
            });
        }

        wireUpSlot({
            meshesRef: () => shirtMeshes,
            uploadBtnId: 'shirt-upload-btn',
            fileInputId: 'shirt-file-input',
            previewBoxId: 'shirt-preview-box',
            previewImgId: 'shirt-preview-img',
            previewNameId: 'shirt-preview-name',
            resetBtnId: 'shirt-reset-btn',
            origMats: shirtOrigMat,
            label: 'Shirt',
        });

        wireUpSlot({
            meshesRef: () => pantMeshes,
            uploadBtnId: 'pant-upload-btn',
            fileInputId: 'pant-file-input',
            previewBoxId: 'pant-preview-box',
            previewImgId: 'pant-preview-img',
            previewNameId: 'pant-preview-name',
            resetBtnId: 'pant-reset-btn',
            origMats: pantOrigMat,
            label: 'Pant',
        });

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
