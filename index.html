<!DOCTYPE html>
<html>
<head>
    <title>Avatar Shirt Try-On</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #111122; font-family: sans-serif; }

        #ui {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        #upload-btn {
            padding: 12px 28px;
            background: #4f8ef7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79,142,247,0.4);
            transition: background 0.2s;
        }
        #upload-btn:hover { background: #2d6ee0; }

        #file-input { display: none; }

        #preview-box {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #ccc;
            font-size: 13px;
        }
        #preview-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #555;
        }

        #reset-btn {
            display: none;
            padding: 7px 18px;
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        #reset-btn:hover { background: rgba(255,255,255,0.05); }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="status">Loading avatar...</div>

    <div id="ui">
        <div id="preview-box">
            <img id="preview-img" src="" alt="shirt" />
            <span id="preview-name">shirt.png</span>
        </div>
        <button id="upload-btn">Upload Shirt Image</button>
        <input type="file" id="file-input" accept="image/*" />
        <button id="reset-btn">Reset Shirt</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x4466ff, 0.3);
        backLight.position.set(-1, 0, -1);
        scene.add(backLight);

        // --- Load Avatar ---
        const statusEl = document.getElementById('status');
        let shirtMeshes = [];        // meshes we'll apply the shirt texture to
        let originalMaterials = {};  // store originals for reset

        const loader = new GLTFLoader();
        const url = `https://models.readyplayer.me/664777277ad2faec5b6079f0.glb`;

        loader.load(
            url,
            (gltf) => {
                // gltf.scene.scale.set(0.01, 0.01, 0.01);
                scene.add(gltf.scene);

                gltf.scene.traverse((node) => {
                    if (!node.isMesh) return;

                    const name = node.name.toLowerCase();
                    console.log('Mesh found:', node.name);

                    if (node.name == "Wolf3D_Outfit_Top") {
                        shirtMeshes.push(node);
                        originalMaterials[node.uuid] = node.material.clone();
                    }
                });
            },
            (xhr) => {
                const pct = Math.round(xhr.loaded / xhr.total * 100);
                statusEl.textContent = `Loading avatar... ${pct}%`;
            },
            (error) => {
                console.error('Error loading avatar:', error);
                statusEl.textContent = 'Failed to load avatar';
            }
        );

        // --- Shirt Upload Logic ---
        const uploadBtn  = document.getElementById('upload-btn');
        const fileInput  = document.getElementById('file-input');
        const previewBox = document.getElementById('preview-box');
        const previewImg = document.getElementById('preview-img');
        const previewName = document.getElementById('preview-name');
        const resetBtn   = document.getElementById('reset-btn');

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const objectURL = URL.createObjectURL(file);

            // Show preview
            previewImg.src = objectURL;
            previewName.textContent = file.name;
            previewBox.style.display = 'flex';
            resetBtn.style.display = 'block';

            // Extract dominant color from the image and apply it
            getDominantColor(objectURL, (color) => {
                applyShirtColor(color);
                statusEl.textContent = 'Shirt color applied!';
            });
        });

        function getDominantColor(imageUrl, callback) {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let r = 0, g = 0, b = 0, count = 0;

                for (let i = 0; i < data.length; i += 4) {
                    const alpha = data[i + 3];
                    const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    // Skip transparent or near-white pixels (background)
                    if (alpha < 128 || brightness > 230) continue;
                    r += data[i];
                    g += data[i + 1];
                    b += data[i + 2];
                    count++;
                }

                if (count === 0) { callback(new THREE.Color(0x000000)); return; }
                callback(new THREE.Color(r / count / 255, g / count / 255, b / count / 255));
            };
            img.src = imageUrl;
        }

        function applyShirtColor(color) {
            shirtMeshes.forEach((mesh) => {
                mesh.material = new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.8,
                    metalness: 0.0,
                });
                mesh.material.needsUpdate = true;
            });
        }

        resetBtn.addEventListener('click', () => {
            shirtMeshes.forEach((mesh) => {
                mesh.material = originalMaterials[mesh.uuid];
                mesh.material.needsUpdate = true;
            });
            previewBox.style.display = 'none';
            resetBtn.style.display = 'none';
            previewImg.src = '';
            fileInput.value = '';
            statusEl.textContent = 'Shirt reset — upload a new one below';
        });

        // --- Animate ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
